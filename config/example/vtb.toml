# 复制为 config/vtb.toml 后，取消下面各行的注释并填写真实群号和主播昵称。
# 保持全部注释时代表没有 VTB 群订阅，可以正常通过配置校验。

# [[miz.vtb.subscriptions]]
# groupId = 123456789
# streamers = ["主播昵称"]
# dynamicStreamers = []
# atAllStreamers = []
# dynamicAtAllStreamers = []
# contributionStreamers = []

# 字段说明：
# streamers：本群关注的主播。
# dynamicStreamers：需要轮询并推送动态的主播，必须同时存在于 streamers。
# atAllStreamers：主播开播时 @全体成员，必须同时存在于 streamers。
# dynamicAtAllStreamers：主播发布动态时 @全体成员，必须同时存在于 dynamicStreamers。
# contributionStreamers：实时推送加入大航海/续费及汇总价值达到配置阈值（人民币）的打赏，必须同时存在于 streamers。
# Subscription commands: subscribe/unsubscribe live|dynamic <streamer>.
# contribution 可用 miz vtb subscribe/unsubscribe contribution <streamer> 开关。
# Live and dynamic @all settings can be changed independently.
# A subscription block may contain only streamers (live) or only dynamicStreamers (dynamic).
